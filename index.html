<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
--bg:#f3f5f8;--panel:#fff;--line:#dde2ea;--text:#16202e;--mute:#667388;--accent:#1f6feb;--accent-t:#fff;--chip:#e9eef6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--panel:#151c25;--line:#243040;--text:#e6ebf2;--mute:#8b98ab;--accent:#4c9aff;--accent-t:#06101d;--chip:#1d2733}}
:root[data-theme="dark"]{--bg:#0e1319;--panel:#151c25;--line:#243040;--text:#e6ebf2;--mute:#8b98ab;--accent:#4c9aff;--accent-t:#06101d;--chip:#1d2733}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.danger{color:#d64545}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0 6px 0 0}
#provs{display:flex;gap:6px;flex:1;overflow-x:auto;min-width:200px}
.prov{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;white-space:nowrap;background:var(--chip);border:1px solid var(--line);cursor:pointer}
.prov.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.prov img{width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff}
.prov .ed{opacity:.7;font-size:12px;padding:0 2px}
main{flex:1;display:grid;grid-template-columns:minmax(300px,360px) 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px 4px;border-bottom:3px solid transparent}
.tabs button.on{border-bottom-color:var(--accent);font-weight:600}
.tools{display:flex;gap:6px;padding:8px}
.tools input,.tools select{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#list{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:var(--chip)}
.row.on{background:var(--chip);box-shadow:inset 3px 0 var(--accent)}
.row img,.row .ph{width:38px;height:38px;flex:none;object-fit:contain;border-radius:6px;background:#fff}
.row .ph{background:var(--chip);display:grid;place-items:center;color:var(--mute);font-size:12px}
.row .t{min-width:0}.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--mute)}
details summary{padding:9px 12px;cursor:pointer;font-weight:600;border-bottom:1px solid var(--line)}
details .row{padding-left:26px}
.empty{padding:28px 18px;color:var(--mute);text-align:center}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;gap:10px;overflow:auto}
.screen{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:72vh;width:100%;display:grid;place-items:center;position:relative}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:auto 0 0 0;padding:8px 12px;background:#000a;color:#fff;font-size:13px;display:none}
.now{display:flex;align-items:center;gap:12px}
.now img{height:34px;max-width:90px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.now h2{margin:0;font-size:18px}.now small{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px}
dialog label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
dialog input[type=text],dialog input[type=url]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#lp{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);display:none;margin-top:6px}
@media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.stage{order:-1;padding:10px}aside{border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>📺 Meu Player</h1>
  <div id="provs"></div>
  <button class="pri" id="bList">+ Lista</button>
  <button id="bFiles">+ Arquivos</button>
  <button id="bTheme" title="Tema">◐</button>
  <input type="file" id="fFiles" multiple accept="video/*,audio/*,.m3u,.m3u8,.mkv,.ts" hidden>
</header>
<main>
  <aside>
    <div class="tabs" id="tabs">
      <button data-t="live" class="on">Ao vivo</button><button data-t="movie">Filmes</button><button data-t="series">Séries</button>
    </div>
    <div class="tools"><input id="q" type="search" placeholder="Buscar…"><select id="cat"></select></div>
    <div id="list"></div>
  </aside>
  <section class="stage">
    <div class="screen"><video id="v" controls playsinline></video><div id="msg"></div></div>
    <div class="now" id="now"><div><h2>Escolha algo para assistir</h2><small>Adicione uma lista M3U ou arquivos para começar.</small></div></div>
  </section>
</main>

<dialog id="dlg">
  <h3 id="dT">Adicionar lista</h3>
  <label for="dName">Nome do fornecedor</label>
  <input type="text" id="dName" placeholder="Ex.: Minha operadora">
  <div id="srcBox">
    <label for="dUrl">Link da lista (M3U / M3U8)</label>
    <input type="url" id="dUrl" placeholder="https://…/lista.m3u">
    <label for="dFile">…ou arquivo da lista</label>
    <input type="file" id="dFile" accept=".m3u,.m3u8,.txt">
  </div>
  <label for="dLogoUrl">Logo do fornecedor (link)</label>
  <input type="url" id="dLogoUrl" placeholder="https://…/logo.png">
  <label for="dLogo">…ou imagem do computador</label>
  <input type="file" id="dLogo" accept="image/*">
  <img id="lp" alt="Prévia do logo">
  <div class="acts"><button class="danger" id="dDel" style="margin-right:auto">Remover</button><button id="dCancel">Cancelar</button><button class="pri" id="dOk">Salvar</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const S={prov:[],tab:'live',active:'all',q:'',cat:'',cur:null,editId:null,logo:''};
let hls=null,uid=0;
const KEY='meuplayer.v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.prov.map(p=>({...p,items:p.items.filter(i=>!i.url.startsWith('blob:'))}))))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)S.prov=JSON.parse(r)||[]}catch(e){}}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function msg(t){const m=$('#msg');m.textContent=t||'';m.style.display=t?'block':'none'}

/* ---------- M3U ---------- */
function classify(name,group,url){
  if(/\/series\//i.test(url)||/s\d{1,2}\s?e\d{1,3}/i.test(name)||/s[ée]ries?/i.test(group))return'series';
  if(/\/movie\//i.test(url)||/filme|movie|vod|cinema|lan[cç]amento/i.test(group))return'movie';
  return'live';
}
function parseM3U(txt){
  const out=[];let meta=null;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      meta={};for(const m of l.matchAll(/([\w-]+)="([^"]*)"/g))meta[m[1].toLowerCase()]=m[2];
      meta.name=(l.slice(l.lastIndexOf(',')+1)||meta['tvg-name']||'Sem nome').trim();
    }else if(l[0]!=='#'){
      const m=meta||{name:l.split('/').pop()};
      const group=m['group-title']||'Outros';
      const type=classify(m.name,group,l);
      const it={id:'i'+(++uid)+Date.now(),name:m.name,url:l,logo:m['tvg-logo']||'',group,type};
      if(type==='series'){
        const s=m.name.match(/^(.*?)[\s\-–:]*S(\d{1,2})\s?E(\d{1,3})/i);
        it.series=s?s[1].trim()||m.name:m.name;it.season=s?+s[2]:1;it.ep=s?+s[3]:0;
      }
      out.push(it);meta=null;
    }
  }
  return out;
}

/* ---------- render ---------- */
function items(){
  let a=[];for(const p of S.prov)if(S.active==='all'||S.active===p.id)for(const i of p.items)a.push({...i,pid:p.id,plogo:p.logo});
  return a;
}
function renderProvs(){
  const box=$('#provs');box.replaceChildren();
  const all=el('div','prov'+(S.active==='all'?' on':''),'Todos');all.onclick=()=>{S.active='all';S.cat='';render()};box.append(all);
  for(const p of S.prov){
    const d=el('div','prov'+(S.active===p.id?' on':''));
    if(p.logo){const im=el('img');im.src=p.logo;im.alt='';d.append(im)}
    d.append(el('span',null,p.name));
    const ed=el('span','ed','✎');ed.title='Editar';ed.onclick=e=>{e.stopPropagation();openDlg(p.id)};d.append(ed);
    d.onclick=()=>{S.active=p.id;S.cat='';render()};box.append(d);
  }
}
function row(it){
  const r=el('div','row'+(S.cur&&S.cur.id===it.id?' on':''));
  const logo=it.logo||it.plogo;
  if(logo){const im=el('img');im.loading='lazy';im.alt='';im.src=logo;im.onerror=()=>{im.replaceWith(el('div','ph','▶'))};r.append(im)}else r.append(el('div','ph','▶'));
  const t=el('div','t');t.append(el('b',null,it.type==='series'&&it.ep?`T${it.season} · Ep. ${it.ep} — ${it.name}`:it.name),el('small',null,it.group));
  r.append(t);r.onclick=()=>play(it);r.tabIndex=0;r.onkeydown=e=>{if(e.key==='Enter')play(it)};return r;
}
function renderList(){
  const L=$('#list');L.replaceChildren();
  const all=items().filter(i=>i.type===S.tab);
  const cats=[...new Set(all.map(i=>i.group))].sort();
  const sel=$('#cat');sel.replaceChildren(new Option('Todas as categorias',''));cats.forEach(c=>sel.append(new Option(c,c)));
  if(!cats.includes(S.cat))S.cat='';sel.value=S.cat;
  const q=S.q.toLowerCase();
  const f=all.filter(i=>(!S.cat||i.group===S.cat)&&(!q||i.name.toLowerCase().includes(q)||(i.series||'').toLowerCase().includes(q)));
  if(!f.length){L.append(el('div','empty',S.prov.length?'Nada encontrado aqui.':'Nenhuma lista ainda. Toque em “+ Lista” ou “+ Arquivos”.'));return}
  if(S.tab==='series'){
    const g={};f.forEach(i=>(g[i.series||i.name]??=[]).push(i));
    Object.keys(g).sort().slice(0,150).forEach(n=>{
      const d=el('details');d.append(el('summary',null,`${n} (${g[n].length})`));
      g[n].sort((a,b)=>a.season-b.season||a.ep-b.ep).forEach(i=>d.append(row(i)));
      if(S.cur&&S.cur.series===n)d.open=true;L.append(d);
    });
  }else f.slice(0,400).forEach(i=>L.append(row(i)));
  if(f.length>400)L.append(el('div','empty','Mostrando 400 itens. Use a busca para filtrar.'));
}
function render(){
  renderProvs();renderList();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
}

/* ---------- player ---------- */
function play(it){
  S.cur=it;const v=$('#v');msg('');
  if(hls){hls.destroy();hls=null}
  const isHls=/\.m3u8(\?|$)/i.test(it.url)||(it.type==='live'&&!/\.(mp4|mkv|ts|webm)(\?|$)/i.test(it.url)&&!it.url.startsWith('blob:'));
  if(isHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls();hls.loadSource(it.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)msg('Não foi possível carregar este canal. O link pode estar offline ou bloqueado pelo servidor.')});
  }else v.src=it.url;
  v.play().catch(()=>{});
  const n=$('#now');n.replaceChildren();
  const logo=it.logo||it.plogo;if(logo){const im=el('img');im.src=logo;im.alt='';im.onerror=()=>im.remove();n.append(im)}
  const d=el('div');d.append(el('h2',null,it.type==='series'&&it.series?`${it.series} — T${it.season} Ep. ${it.ep}`:it.name),el('small',null,it.group));n.append(d);
  renderList();
}
$('#v').addEventListener('error',()=>msg('Formato não suportado ou link inacessível. Tente outro item.'));
$('#v').addEventListener('ended',()=>{
  const c=S.cur;if(!c||c.type!=='series')return;
  const eps=items().filter(i=>i.series===c.series).sort((a,b)=>a.season-b.season||a.ep-b.ep);
  const k=eps.findIndex(i=>i.id===c.id);if(eps[k+1])play(eps[k+1]);
});

/* ---------- adicionar listas / arquivos ---------- */
const dlg=$('#dlg');
function readImg(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)})}
function showLP(src){const p=$('#lp');if(src){p.src=src;p.style.display='block'}else p.style.display='none'}
function openDlg(id){
  S.editId=id||null;S.logo='';
  const p=S.prov.find(x=>x.id===id);
  $('#dT').textContent=p?'Editar fornecedor':'Adicionar lista';
  $('#dName').value=p?p.name:'';$('#dUrl').value='';$('#dFile').value='';$('#dLogo').value='';
  $('#dLogoUrl').value=p&&p.logo&&!p.logo.startsWith('data:')?p.logo:'';
  S.logo=p?p.logo:'';showLP(S.logo);
  $('#srcBox').style.display=p?'none':'block';$('#dDel').style.display=p?'block':'none';
  dlg.showModal();
}
$('#bList').onclick=()=>openDlg();
$('#dCancel').onclick=()=>dlg.close();
$('#dLogo').onchange=async e=>{if(e.target.files[0]){S.logo=await readImg(e.target.files[0]);showLP(S.logo)}};
$('#dLogoUrl').oninput=e=>{S.logo=e.target.value.trim();showLP(S.logo)};
$('#dDel').onclick=()=>{if(confirm('Remover este fornecedor e todos os itens dele?')){S.prov=S.prov.filter(p=>p.id!==S.editId);S.active='all';save();dlg.close();render()}};
$('#dOk').onclick=async()=>{
  const name=$('#dName').value.trim()||'Minha lista';
  if(S.editId){const p=S.prov.find(x=>x.id===S.editId);p.name=name;p.logo=S.logo;save();dlg.close();render();return}
  const url=$('#dUrl').value.trim(),file=$('#dFile').files[0];
  if(!url&&!file){alert('Informe o link ou escolha o arquivo da lista.');return}
  $('#dOk').disabled=true;$('#dOk').textContent='Carregando…';
  try{
    let txt;
    if(file)txt=await file.text();
    else{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);txt=await r.text()}
    const its=parseM3U(txt);
    if(!its.length)throw new Error('Nenhum item encontrado. Verifique se é uma lista M3U válida.');
    S.prov.push({id:'p'+Date.now(),name,logo:S.logo,items:its});
    S.active=S.prov[S.prov.length-1].id;
    const first=['live','movie','series'].find(t=>its.some(i=>i.type===t));S.tab=first;
    save();dlg.close();render();
  }catch(err){
    alert('Não foi possível carregar a lista.\n'+err.message+(file?'':'\n\nDica: alguns servidores bloqueiam o acesso pelo navegador (CORS). Baixe a lista e envie como arquivo.'));
  }
  $('#dOk').disabled=false;$('#dOk').textContent='Salvar';
};
$('#bFiles').onclick=()=>$('#fFiles').click();
$('#fFiles').onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  let local=S.prov.find(p=>p.id==='local');
  for(const f of files){
    if(/\.m3u8?$/i.test(f.name)){
      const its=parseM3U(await f.text());
      if(its.length){S.prov.push({id:'p'+Date.now()+Math.random(),name:f.name.replace(/\.[^.]+$/,''),logo:'',items:its})}
    }else{
      if(!local){local={id:'local',name:'Meus arquivos',logo:'',items:[]};S.prov.push(local)}
      local.items.push({id:'f'+(++uid)+Date.now(),name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),logo:'',group:'Arquivos locais',type:'movie'});
      S.tab='movie';
    }
  }
  e.target.value='';save();render();
};

/* ---------- eventos gerais ---------- */
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;S.cat='';render()}};
$('#q').oninput=e=>{S.q=e.target.value;renderList()};
$('#cat').onchange=e=>{S.cat=e.target.value;renderList()};
$('#bTheme').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1319';r.dataset.theme=dark?'light':'dark'};
load();render();
</script>
</body>
</html>
